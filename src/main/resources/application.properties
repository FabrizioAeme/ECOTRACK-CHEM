spring.application.name=ecotrackchem

# ==== Base de datos (MySQL) ====
# Cambia usuario/clave por los de tu instalacion local de MySQL
spring.datasource.username=root
spring.datasource.password=cope
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_ecotrackchem?createDatabaseIfNotExist=true&serverTimezone=UTC

# update: Hibernate crea/actualiza las tablas automaticamente a partir de las entidades.
# (En clase el profesor usa "validate" + script SQL manual; con "update" no necesitas
# escribir el DDL a mano, ideal para avanzar rapido en el proyecto integrador).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==== JWT ====
application.jwt.secret-key=ecotrackchemsupersecretkeythatshouldbelongandcomplex1234567890
application.jwt.token-prefix=Bearer 
application.jwt.token-expiration-after-days=7
application.jwt.refresh-token-expiration-after-days=30

# ==== Swagger / OpenAPI ====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
springdoc.default-produces-media-type=application/json
