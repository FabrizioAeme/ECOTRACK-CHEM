<div class="selector" role="radiogroup" [attr.aria-label]="etiqueta()">
  @for (opcion of opciones(); track opcion.valor) {
    <button
      type="button"
      role="radio"
      class="opcion"
      [class]="'opcion-' + opcion.color"
      [class.activa]="valor() === opcion.valor"
      [attr.aria-checked]="valor() === opcion.valor"
      [attr.aria-label]="opcion.etiqueta"
      [disabled]="deshabilitado()"
      (click)="seleccionar(opcion.valor)"
      (blur)="onTouched()"
    >
      <i class="bi" [class]="opcion.icono"></i>
      <span class="d-flex flex-column text-start">
        <span class="fw-semibold">{{ opcion.etiqueta }}</span>
        @if (mostrarDescripcion() && opcion.descripcion) {
          <small class="text-body-secondary">{{ opcion.descripcion }}</small>
        }
      </span>
      @if (valor() === opcion.valor) {
        <i class="bi bi-check-circle-fill ms-auto check"></i>
      }
    </button>
  }
</div>
